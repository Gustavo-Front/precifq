
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora de Precificação</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --secondary: #e0e7ff;
      --bg: #f9fafb;
      --text: #1f2937;
      --card-bg: #ffffff;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 2rem;
      color: var(--text);
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      position: relative;
    }
    h2 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 1rem;
    }
    .field {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    input[type="number"] {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      font-size: 1rem;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
    }
    #resultado {
      margin-top: 2rem;
      background: #f0f4ff;
      padding: 1.5rem;
      border-radius: 0.75rem;
      border: 1px solid #c7d2fe;
    }
    canvas {
      margin-top: 2rem;
      max-width: 600px;
      height: 300px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .logout {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .logout:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="logout" id="logoutBtn">Sair</button>
    <h2>Calculadora de Precificação</h2>

    <div class="field"><label>Preço de Custo do Produto (R$)</label><input type="number" id="custo"></div>
    <div class="field"><label>Comissão do Marketplace (%)</label><input type="number" id="comissao"></div>
    <div class="field"><label>Frete/Fixo (R$)</label><input type="number" id="frete"></div>
    <div class="field"><label>Embalagens e Outros Custos (R$)</label><input type="number" id="embalagem"></div>
    <div class="field"><label>Imposto (%)</label><input type="number" id="imposto"></div>
    <div class="field"><label>Margem de Lucro Desejada (%)</label><input type="number" id="lucro"></div>
    <div class="field"><label>Parcerias/Influencers (%)</label><input type="number" id="parcerias"></div>

    <button onclick="calcular()">Calcular</button>
    <div id="resultado"></div>
    <canvas id="grafico"></canvas>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBci5VU1EiVZJvIjns0A_3vpOY3VzJuZ0M",
      authDomain: "precifq.firebaseapp.com",
      projectId: "precifq",
      storageBucket: "precifq.appspot.com",
      messagingSenderId: "839718876371",
      appId: "1:839718876371:web:6da95c3a6b85a95fd99026"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    window.calcular = function () {
      const custo = parseFloat(document.getElementById('custo').value) || 0;
      const comissao = parseFloat(document.getElementById('comissao').value) || 0;
      const frete = parseFloat(document.getElementById('frete').value) || 0;
      const embalagem = parseFloat(document.getElementById('embalagem').value) || 0;
      const imposto = parseFloat(document.getElementById('imposto').value) || 0;
      const lucro = parseFloat(document.getElementById('lucro').value) || 0;
      const parcerias = parseFloat(document.getElementById('parcerias').value) || 0;

      const precoVenda = (custo + frete + embalagem) / (1 - ((comissao + imposto + parcerias + lucro) / 100));

      const valores = {
        custo,
        comissao: precoVenda * comissao / 100,
        frete,
        embalagem,
        imposto: precoVenda * imposto / 100,
        parcerias: precoVenda * parcerias / 100,
        lucro: precoVenda - custo - frete - embalagem - (precoVenda * (comissao + imposto + parcerias) / 100)
      };

      const totalCustos = valores.custo + valores.comissao + valores.frete + valores.embalagem + valores.imposto + valores.parcerias;

      document.getElementById('resultado').innerHTML = `
        <h3>Resultado</h3>
        <p><strong>Preço de Venda Sugerido:</strong> R$ ${precoVenda.toFixed(2)}</p>
        <p><strong>Detalhamento:</strong></p>
        <p>• Custo do Produto: R$ ${valores.custo.toFixed(2)}</p>
        <p>• Comissão (${comissao}%): R$ ${valores.comissao.toFixed(2)}</p>
        <p>• Frete: R$ ${valores.frete.toFixed(2)}</p>
        <p>• Embalagem e Outros: R$ ${valores.embalagem.toFixed(2)}</p>
        <p>• Imposto (${imposto}%): R$ ${valores.imposto.toFixed(2)}</p>
        <p>• Parcerias (${parcerias}%): R$ ${valores.parcerias.toFixed(2)}</p>
        <p><strong>Lucro Final:</strong> R$ ${valores.lucro.toFixed(2)} (${((valores.lucro / precoVenda) * 100).toFixed(2)}%)</p>
      `;

      const ctx = document.getElementById('grafico').getContext('2d');
      if (window.graficoPizza) window.graficoPizza.destroy();
      window.graficoPizza = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Custo', 'Comissão', 'Frete', 'Embalagem', 'Imposto', 'Parcerias', 'Lucro'],
          datasets: [{
            label: 'Distribuição de Valores (R$)',
            data: [valores.custo, valores.comissao, valores.frete, valores.embalagem, valores.imposto, valores.parcerias, valores.lucro],
            backgroundColor: ['#4f46e5', '#f43f5e', '#facc15', '#0ea5e9', '#8b5cf6', '#fb923c', '#22c55e']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }
  </script>
</body>
</html>
