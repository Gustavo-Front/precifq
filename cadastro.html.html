
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro - Calculadora</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f9fafb;
      --text: #1f2937;
      --card-bg: #ffffff;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg); margin: 0; padding: 2rem; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: var(--card-bg); padding: 2rem; border-radius: 1rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06); width: 100%; max-width: 400px;
    }
    h2 { text-align: center; margin-bottom: 1.5rem; color: var(--primary); }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    input[type="email"], input[type="password"] {
      width: 100%; padding: 0.75rem; border-radius: 0.5rem;
      border: 1px solid var(--border); margin-bottom: 1.25rem; font-size: 1rem;
    }
    button {
      width: 100%; padding: 0.75rem; background: var(--primary);
      color: white; border: none; border-radius: 0.5rem;
      font-size: 1rem; cursor: pointer;
    }
    button:hover { background: #4338ca; }
    .switch {
      margin-top: 1rem; text-align: center; font-size: 0.95rem;
    }
    .switch a {
      color: var(--primary); text-decoration: none; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Cadastro</h2>
    <form id="cadastroForm">
      <label for="email">E-mail</label>
      <input type="email" id="email" required>
      <label for="senha">Senha</label>
      <input type="password" id="senha" required>
      <button type="submit">Cadastrar</button>
    </form>
    <div class="switch">
      Já tem uma conta? <a href="login.html">Faça login</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBci5VU1EiVZJvIjns0A_3vpOY3VzJuZ0M",
      authDomain: "precifq.firebaseapp.com",
      projectId: "precifq",
      storageBucket: "precifq.appspot.com",
      messagingSenderId: "839718876371",
      appId: "1:839718876371:web:6da95c3a6b85a95fd99026"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();

    document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      try {
        await createUserWithEmailAndPassword(auth, email, senha);
        Swal.fire({
          icon: 'success',
          title: 'Cadastro realizado!',
          text: 'Redirecionando para o login...',
          confirmButtonColor: '#4f46e5',
          timer: 3000,
          showConfirmButton: false
        });
        setTimeout(() => window.location.href = 'login.html', 3000);
      } catch (error) {
        Swal.fire({
          icon: 'error',
          title: 'Erro no cadastro',
          text: error.message,
          confirmButtonColor: '#ef4444'
        });
      }
    });
  </script>
</body>
</html>
